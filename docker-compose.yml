services:

  flask-app:

    build: ./app

    container_name: flask-app

    restart: unless-stopped

  nginx:

    image: nginx:latest

    container_name: web-nginx

    ports:
      - "8080:80"

    volumes:
      - ./compose/nginx/conf/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - flask-app

    restart: unless-stopped
